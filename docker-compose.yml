services:
  postgres:
    image: postgres:17
    container_name: gradesense-postgres
    environment:
      POSTGRES_USER: gradesense
      POSTGRES_PASSWORD: gradesense
      POSTGRES_DB: gradesense
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8
    container_name: gradesense-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
